apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    app: {{ .Values.appLabel }}

spec:
  type: {{ .Values.service.type }}

  selector:
    app: {{ .Values.appLabel }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
