apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-flask-app
  labels:
    app: devops-flask-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-flask-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: devops-flask-app

    spec:
      containers:
        - name: flask-app

          # Local kind image; use ECR image URI for AWS EKS deployment
          image: devops-flask-app:784a744

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
